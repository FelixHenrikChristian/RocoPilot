name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub release as prerelease."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "RocoPilot/RocoPilot.csproj"
      - "RocoPilot/Package.appxmanifest"
      - "RocoPilot/app.manifest"

permissions:
  contents: read

env:
  ROCO_R2_PUBLIC_URL: https://pub-749777b9646245b7bc1b15efee2b9b24.r2.dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_release_assets:
    name: Build release assets
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          [xml]$projectXml = Get-Content "RocoPilot/RocoPilot.csproj" -Raw
          $projectVersion = [string](($projectXml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version)
          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "RocoPilot.csproj does not contain a <Version> value."
          }

          $fileVersion = [string](($projectXml.Project.PropertyGroup | Where-Object { $_.FileVersion } | Select-Object -First 1).FileVersion)
          $assemblyVersion = [string](($projectXml.Project.PropertyGroup | Where-Object { $_.AssemblyVersion } | Select-Object -First 1).AssemblyVersion)

          [xml]$packageXml = Get-Content "RocoPilot/Package.appxmanifest" -Raw
          $packageIdentity = $packageXml.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          $packageVersion = [string]$packageIdentity.Version

          [xml]$applicationManifestXml = Get-Content "RocoPilot/app.manifest" -Raw
          $applicationIdentity = $applicationManifestXml.SelectSingleNode("/*[local-name()='assembly']/*[local-name()='assemblyIdentity']")
          $applicationVersion = [string]$applicationIdentity.version

          if ($projectVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "RocoPilot.csproj version '$projectVersion' must use the x.y.z format."
          }

          $windowsVersion = "$projectVersion.0"
          $versionValues = [ordered]@{
            "RocoPilot.csproj FileVersion" = $fileVersion
            "RocoPilot.csproj AssemblyVersion" = $assemblyVersion
            "Package.appxmanifest Identity Version" = $packageVersion
            "app.manifest assemblyIdentity version" = $applicationVersion
          }
          foreach ($entry in $versionValues.GetEnumerator()) {
            if ($entry.Value -ne $windowsVersion) {
              throw "$($entry.Key) '$($entry.Value)' does not match expected version '$windowsVersion'."
            }
          }

          if ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME -replace "^v", ""
            if ($version -ne $projectVersion) {
              throw "Tag version '$version' does not match RocoPilot.csproj version '$projectVersion'."
            }
          }
          else {
            $version = $projectVersion
          }

          $tag = "v$version"
          function Split-SemVer {
            param([string]$Value)

            $versionWithoutBuild = ($Value -split "\+", 2)[0]
            $versionParts = $versionWithoutBuild -split "-", 2
            $coreParts = $versionParts[0] -split "\."

            [pscustomobject]@{
              Major = [int]$coreParts[0]
              Minor = [int]$coreParts[1]
              Patch = [int]$coreParts[2]
              PreRelease = if ($versionParts.Count -gt 1) { $versionParts[1] } else { $null }
            }
          }

          function Compare-SemVer {
            param(
              [string]$Left,
              [string]$Right
            )

            $leftVersion = Split-SemVer $Left
            $rightVersion = Split-SemVer $Right

            foreach ($part in @("Major", "Minor", "Patch")) {
              if ($leftVersion.$part -lt $rightVersion.$part) { return -1 }
              if ($leftVersion.$part -gt $rightVersion.$part) { return 1 }
            }

            if ([string]::IsNullOrWhiteSpace($leftVersion.PreRelease) -and [string]::IsNullOrWhiteSpace($rightVersion.PreRelease)) {
              return 0
            }
            if ([string]::IsNullOrWhiteSpace($leftVersion.PreRelease)) { return 1 }
            if ([string]::IsNullOrWhiteSpace($rightVersion.PreRelease)) { return -1 }

            $leftIdentifiers = $leftVersion.PreRelease -split "\."
            $rightIdentifiers = $rightVersion.PreRelease -split "\."
            $count = [Math]::Max($leftIdentifiers.Count, $rightIdentifiers.Count)

            for ($i = 0; $i -lt $count; $i++) {
              if ($i -ge $leftIdentifiers.Count) { return -1 }
              if ($i -ge $rightIdentifiers.Count) { return 1 }

              $leftId = $leftIdentifiers[$i]
              $rightId = $rightIdentifiers[$i]
              $leftNumber = 0
              $rightNumber = 0
              $leftIsNumber = [int]::TryParse($leftId, [ref]$leftNumber)
              $rightIsNumber = [int]::TryParse($rightId, [ref]$rightNumber)

              if ($leftIsNumber -and $rightIsNumber) {
                if ($leftNumber -lt $rightNumber) { return -1 }
                if ($leftNumber -gt $rightNumber) { return 1 }
              }
              elseif ($leftIsNumber) {
                return -1
              }
              elseif ($rightIsNumber) {
                return 1
              }
              else {
                $textComparison = [string]::CompareOrdinal($leftId, $rightId)
                if ($textComparison -lt 0) { return -1 }
                if ($textComparison -gt 0) { return 1 }
              }
            }

            return 0
          }

          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch git tags."
          }

          $existingVersions = @(
            git tag --list "v*" |
              ForEach-Object {
                if ($_ -match '^v(?<version>\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$') {
                  $Matches.version
                }
              }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list git tags."
          }

          $newerVersion = $null
          $tagExists = $false
          foreach ($existingVersion in $existingVersions) {
            $comparison = Compare-SemVer $existingVersion $version
            if ($comparison -eq 0) {
              $tagExists = $true
            }
            if ($comparison -gt 0 -and ($null -eq $newerVersion -or (Compare-SemVer $existingVersion $newerVersion) -gt 0)) {
              $newerVersion = $existingVersion
            }
          }

          if ($null -ne $newerVersion) {
            throw "Existing release tag 'v$newerVersion' is newer than '$tag'. Bump RocoPilot.csproj <Version> before releasing."
          }

          if ($tagExists -and $env:REF_TYPE -ne "tag") {
            if ($env:EVENT_NAME -eq "push") {
              "should_release=false" >> $env:GITHUB_OUTPUT
              Write-Host "Tag '$tag' already exists. This branch push is not a new release; skipping."
              exit 0
            }

            throw "Tag '$tag' already exists. Bump the application version before starting a manual release."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_release=true" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Release version: $version"
          Write-Host "Release tag: $tag"

      - name: Setup .NET 10 SDK
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore RocoPilot
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: dotnet restore RocoPilot/RocoPilot.csproj

      - name: Download Kachina builder
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          KACHINA_BUILDER_URL: ${{ vars.KACHINA_BUILDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = $env:KACHINA_BUILDER_URL
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = "https://github.com/YuehaiTeam/kachina-installer/releases/latest/download/kachina-builder.exe"
          }

          Write-Host "Downloading kachina-builder.exe from $url"
          Invoke-WebRequest -Uri $url -OutFile "update/kachina-builder.exe"
          Unblock-File -LiteralPath "update/kachina-builder.exe" -ErrorAction SilentlyContinue

      - name: Configure Kachina R2 source
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $r2PublicUrl = $env:ROCO_R2_PUBLIC_URL.TrimEnd("/")
          $cloudflareUrl = "$r2PublicUrl/RocoPilot.Install.exe"
          "ROCO_KACHINA_CLOUDFLARE_URL=$cloudflareUrl" >> $env:GITHUB_ENV
          Write-Host "Kachina R2 source: $cloudflareUrl"

      - name: Build Kachina updater
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: .\update\build-kachina.ps1 -Version "$env:APP_VERSION" -UpdaterOnly

      - name: Build MicaSetup installer and publish app
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: .\build\build-installer.ps1 -RequireUpdater

      - name: Build Kachina offline installer
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\update\build-kachina.ps1 `
            -Version "$env:APP_VERSION" `
            -SkipPublish `
            -PublishDir ".\build\publish" `
            -SkipUpdaterBuild

      - name: Collect release assets
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null

          Copy-Item "update/RocoPilot.update.exe" "artifacts/RocoPilot.update.exe" -Force
          Copy-Item "update/RocoPilot.Install.exe" "artifacts/RocoPilot.Install.exe" -Force

          $micaInstaller = Get-ChildItem "build" -Filter "RocoPilot-Setup-v*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $micaInstaller) {
            throw "MicaSetup installer was not created."
          }
          Copy-Item $micaInstaller.FullName "artifacts/RocoPilot-Setup.exe" -Force

          Get-ChildItem "artifacts" -File | Format-Table Name, Length

      - name: Upload release assets
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  create_github_release:
    name: Create GitHub release
    needs: build_release_assets
    if: needs.build_release_assets.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tags created by GITHUB_TOKEN do not recursively trigger another release run.
          token: ${{ github.token }}

      - name: Create release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build_release_assets.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build_release_assets.outputs.version }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag already exists: ${RELEASE_TAG}"
            exit 0
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "RocoPilot ${RELEASE_VERSION}"
          git push origin "${RELEASE_TAG}"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build_release_assets.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RocoPilot ${{ needs.build_release_assets.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: true
          token: ${{ github.token }}
          body: |
            # RocoPilot ${{ needs.build_release_assets.outputs.version }}

            ## 🎉 特性：
            - **待补充**：填写本次新增的主要功能。

            ## ✨ 优化：
            - **待补充**：填写体验、性能、流程、界面等优化内容。

            ## 🔧 修复：
            - **待补充**：填写本次修复的问题。

            ## ⚠️ 注意：
            - 暂无

            <details>
            <summary>📦 安装包说明</summary>

            - `RocoPilot-Setup.exe`：完整安装程序，推荐首次安装或手动安装使用。
            - `RocoPilot.update.exe`：应用内更新器，用于自动下载并执行更新。
            - `RocoPilot.Install.exe`：应用内更新所需的安装包，由更新器使用。

            </details>
          files: artifacts/*
